<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1030">
<title>Сердечки 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body {
    position: fixed;
    inset: 0;
    font-family: "Nunito", Arial, sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #7a2a56 0%, transparent 55%),
      radial-gradient(140% 100% at 50% 115%, #8f2f5c 0%, transparent 50%),
      linear-gradient(175deg, #2b1030 0%, #4a1942 55%, #5c1e4c 100%);
  }

  body::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: radial-gradient(45% 35% at 50% 40%, rgba(255,123,172,.2), transparent 70%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%,100% { opacity: .7; transform: scale(1); }
    50%     { opacity: 1;  transform: scale(1.08); }
  }

  /* фоновые плавающие сердечки */
  .mote {
    position: absolute;
    color: #ffc2d4;
    text-shadow: 0 0 12px rgba(255,150,190,.9);
    animation: drift ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translateY(0)     rotate(-8deg); }
    to   { transform: translateY(-24px) rotate(10deg); }
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 3;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px;
  }

  h1 {
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: clamp(38px, 11vw, 52px);
    color: #fff4f6;
    text-shadow: 0 2px 24px rgba(255,110,160,.6);
    text-align: center;
    line-height: 1.05;
  }

  .sub {
    font-size: 14.5px;
    color: rgba(255,214,228,.75);
    margin-bottom: 30px;
    text-align: center;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }

  .key {
    width: 108px;
    height: 108px;
    border-radius: 32px;
    border: 1px solid rgba(255,255,255,.35);
    background:
      radial-gradient(120% 90% at 30% 15%, rgba(255,255,255,.32), transparent 55%),
      linear-gradient(160deg, var(--c1), var(--c2));
    box-shadow:
      0 14px 34px rgba(20,4,24,.5),
      0 4px 14px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.4),
      inset 0 -6px 14px rgba(0,0,0,.18);
    font-size: 46px;
    cursor: pointer;
    transition: transform .1s ease;
    animation: bob 2.6s ease-in-out infinite;
  }
  .key:nth-child(2) { animation-delay: .4s; }
  .key:nth-child(3) { animation-delay: .8s; }
  .key:nth-child(4) { animation-delay: 1.2s; }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-7px); }
  }
  .key:active {
    transform: scale(.86) !important;
    animation-play-state: paused;
  }

  .counter {
    margin-top: 34px;
    font-size: 16px;
    font-weight: 800;
    color: #ffd0e0;
    text-shadow: 0 0 14px rgba(255,110,160,.6);
    min-height: 24px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <canvas id="fx"></canvas>

  <div class="wrap">
    <h1>Жми на кнопки 💕</h1>
    <div class="sub">из каждой вылетают свои сердечки и салютики</div>

    <div class="pad">
      <button class="key" style="--c1:#ff9cc0; --c2:#ff4f87; --glow:rgba(255,79,135,.5)"  data-set="💗,💓,💞">💗</button>
      <button class="key" style="--c1:#ffc2d4; --c2:#ff7bac; --glow:rgba(255,123,172,.5)" data-set="💖,✨,💫">💖</button>
      <button class="key" style="--c1:#e6a7ff; --c2:#b45cf0; --glow:rgba(180,92,240,.5)"  data-set="💘,💝,💜">💘</button>
      <button class="key" style="--c1:#ffd9a6; --c2:#ff8f66; --glow:rgba(255,143,102,.5)" data-set="🌸,🧡,❤️">🌸</button>
    </div>

    <div class="counter" id="counter"></div>
  </div>

<script>
(function () {
  /* ---------- фоновые сердечки ---------- */
  var glyphs = ['💗','💖','🤍','♡','💕'];
  for (var i = 0; i < 16; i++) {
    var m = document.createElement('span');
    m.className = 'mote';
    m.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    m.style.left = (Math.random() * 100) + '%';
    m.style.top  = (Math.random() * 100) + '%';
    m.style.fontSize = (10 + Math.random() * 20) + 'px';
    m.style.opacity = .25 + Math.random() * .45;
    m.style.animationDuration = (3 + Math.random() * 4) + 's';
    m.style.animationDelay = (-Math.random() * 4) + 's';
    document.body.appendChild(m);
  }

  /* ---------- canvas-салют ---------- */
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    cv.width  = window.innerWidth * dpr;
    cv.height = window.innerHeight * dpr;
    cv.style.width  = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var sparks = [];   // розовые искры салюта
  var hearts = [];   // летящие сердечки
  var pinks = ['#ff4f87', '#ff7bac', '#ff9cc0', '#ffc2d4', '#ffffff', '#ffd0e0'];

  function boom(x, y, set) {
    /* сердечки из кнопки */
    var n = 12 + Math.floor(Math.random() * 6);
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
      var sp = 5 + Math.random() * 8;
      hearts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 3,
        g: 0.16,
        rot: (Math.random() - 0.5) * 0.5,
        angle: (Math.random() - 0.5) * 1,
        size: 18 + Math.random() * 20,
        char: set[Math.floor(Math.random() * set.length)],
        life: 1,
        decay: 0.008 + Math.random() * 0.006
      });
    }
    /* розовый салютик */
    var s = 36 + Math.floor(Math.random() * 16);
    for (var j = 0; j < s; j++) {
      var a2 = Math.random() * Math.PI * 2;
      var sp2 = 2 + Math.random() * 7.5;
      sparks.push({
        x: x, y: y,
        px: x, py: y,
        vx: Math.cos(a2) * sp2,
        vy: Math.sin(a2) * sp2,
        g: 0.09,
        color: pinks[Math.floor(Math.random() * pinks.length)],
        life: 1,
        decay: 0.014 + Math.random() * 0.014,
        w: 1.2 + Math.random() * 1.8
      });
    }
  }

  function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);

    /* искры — светящиеся хвосты */
    ctx.globalCompositeOperation = 'lighter';
    for (var i = sparks.length - 1; i >= 0; i--) {
      var p = sparks[i];
      p.px = p.x; p.py = p.y;
      p.vy += p.g;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.lineWidth = p.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    /* сердечки */
    for (var k = hearts.length - 1; k >= 0; k--) {
      var h = hearts[k];
      h.vy += h.g;
      h.x += h.vx;
      h.y += h.vy;
      h.angle += h.rot;
      h.life -= h.decay;
      if (h.life <= 0 || h.y > window.innerHeight + 60) { hearts.splice(k, 1); continue; }
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.angle);
      ctx.globalAlpha = Math.min(1, h.life * 2);
      ctx.font = h.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(h.char, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- кнопки ---------- */
  var counter = document.getElementById('counter');
  var total = 0;
  var praises = ['💕', 'вот это салют! 💥', 'ещё! ещё! 💗', 'красотища ✨', 'ты создаёшь любовь 💘', 'сердечный шторм! 🌪💗'];

  document.querySelectorAll('.key').forEach(function (btn) {
    var set = btn.dataset.set.split(',');
    btn.addEventListener('pointerdown', function (e) {
      var r = btn.getBoundingClientRect();
      boom(r.left + r.width / 2, r.top + r.height / 2, set);
      if (navigator.vibrate) navigator.vibrate(20);
      total++;
      counter.textContent = total + ' × ' + praises[Math.min(Math.floor(total / 5), praises.length - 1)];
    });
  });

  /* тап по пустому месту — маленький салютик там */
  document.body.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.key')) return;
    boom(e.clientX, e.clientY, ['💗','♡','✨']);
  });
})();
</script>
</body>
</html>

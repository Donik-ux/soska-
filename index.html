<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1030">
<title>Для тебя 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night-1: #2b1030;
    --night-2: #4a1942;
    --night-3: #7a2a56;
    --rose:    #ff7bac;
    --rose-hot:#ff4f87;
    --blush:   #ffc2d4;
    --cream:   #fff4f6;
    --gold:    #f6c66b;
    --gold-dp: #d99a2b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    position: fixed;
    inset: 0;
    font-family: "Nunito", Arial, sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--night-3) 0%, transparent 55%),
      radial-gradient(140% 100% at 50% 115%, #8f2f5c 0%, transparent 50%),
      linear-gradient(175deg, var(--night-1) 0%, var(--night-2) 55%, #5c1e4c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  /* мягкое дыхание фона */
  body::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: radial-gradient(45% 35% at 50% 42%, rgba(255,123,172,.22), transparent 70%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%,100% { opacity: .7; transform: scale(1); }
    50%     { opacity: 1;  transform: scale(1.08); }
  }

  /* ---------- параллакс-слои с сердечками ---------- */
  .sky { position: absolute; inset: 0; pointer-events: none; }
  .layer { position: absolute; inset: -8%; will-change: transform; }

  .mote {
    position: absolute;
    color: var(--blush);
    text-shadow: 0 0 12px rgba(255,150,190,.9);
    animation: drift ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0)     rotate(-8deg); }
    to   { transform: translateY(-26px) rotate(10deg); }
  }

  /* ---------- 3D-сцена ---------- */
  .scene {
    perspective: 1000px;
    z-index: 2;
    width: min(92vw, 400px);
  }

  .card3d {
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .25s ease-out;
    border-radius: 30px;
    background: linear-gradient(165deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 30px 70px rgba(20, 4, 24, .55),
      inset 0 1px 0 rgba(255,255,255,.35);
    padding: 26px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }

  /* блик, скользящий по стеклу */
  .card3d::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 30px;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.16) 46%, transparent 60%);
    background-size: 260% 100%;
    animation: sheen 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen {
    0%, 55%  { background-position: 130% 0; }
    85%,100% { background-position: -130% 0; }
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--blush);
    opacity: .85;
    margin-bottom: 6px;
    transform: translateZ(30px);
  }

  .question {
    font-family: "Caveat", cursive;
    font-size: clamp(30px, 8.6vw, 38px);
    font-weight: 700;
    color: var(--cream);
    line-height: 1.1;
    text-shadow: 0 2px 18px rgba(255,110,160,.45);
    transform: translateZ(36px);
    margin-bottom: 6px;
  }

  /* ---------- сцена с мишкой ---------- */
  .stage {
    position: relative;
    height: 262px;
    margin: 2px auto 10px;
    width: 240px;
    transform: translateZ(46px);
    transform-style: preserve-3d;
  }

  .bear {
    position: absolute;
    inset: 0;
    animation: bear-bounce 3s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes bear-bounce {
    0%,100% { transform: scale(1,1); }
    7%      { transform: scale(1.04,.93); }
    13%     { transform: scale(.97,1.05); }
    20%     { transform: scale(1,1); }
    82%     { transform: scale(1,1); }
    88%     { transform: scale(1.05,.93); }
    95%     { transform: scale(1,1); }
  }

  /* лапки — качаются вверх на бросок и ловлю */
  .arm { transform-box: fill-box; transform-origin: 80% 20%; }
  .arm.left  { transform-origin: 85% 15%; animation: arm-l 3s ease-in-out infinite; }
  .arm.right { transform-origin: 15% 15%; animation: arm-r 3s ease-in-out infinite; }
  @keyframes arm-l {
    0%,100% { transform: rotate(0); }
    10%     { transform: rotate(-46deg); }
    24%     { transform: rotate(-8deg); }
    45%     { transform: rotate(-20deg); }
    86%     { transform: rotate(-48deg); }
    94%     { transform: rotate(-4deg); }
  }
  @keyframes arm-r {
    0%,100% { transform: rotate(0); }
    10%     { transform: rotate(46deg); }
    24%     { transform: rotate(8deg); }
    45%     { transform: rotate(20deg); }
    86%     { transform: rotate(48deg); }
    94%     { transform: rotate(4deg); }
  }

  /* сердечко, которое летает */
  .fly-heart {
    position: absolute;
    left: 50%;
    bottom: 96px;
    width: 62px;
    height: 62px;
    margin-left: -31px;
    z-index: 5;
    filter: drop-shadow(0 0 16px rgba(255,110,160,.85));
    animation: toss 3s cubic-bezier(.42,.02,.58,1) infinite;
    pointer-events: none;
  }
  @keyframes toss {
    0%   { transform: translateY(0) rotate(0) scale(1); }
    9%   { transform: translateY(2px) rotate(0) scale(.9,.82); }
    16%  { transform: translateY(-60px) rotate(90deg) scale(1); }
    42%  { transform: translateY(-158px) rotate(300deg) scale(1.06); }
    50%  { transform: translateY(-166px) rotate(360deg) scale(1.06); }
    58%  { transform: translateY(-158px) rotate(400deg) scale(1.06); }
    84%  { transform: translateY(-6px) rotate(680deg) scale(1); }
    90%  { transform: translateY(4px) rotate(720deg) scale(1.18,.86); }
    100% { transform: translateY(0) rotate(720deg) scale(1); }
  }

  /* искры в верхней точке полёта */
  .twinkle {
    position: absolute;
    font-size: 15px;
    color: #ffe3ee;
    text-shadow: 0 0 10px #ff9cc0;
    opacity: 0;
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 6;
  }
  @keyframes twinkle {
    0%,38%  { opacity: 0; transform: scale(.3) rotate(0); }
    50%     { opacity: 1; transform: scale(1.25) rotate(40deg); }
    62%,100%{ opacity: 0; transform: scale(.3) rotate(80deg); }
  }
  .twinkle.t1 { left: 26px;  top: 26px; }
  .twinkle.t2 { right: 30px; top: 14px; animation-delay: .12s; font-size: 12px; }
  .twinkle.t3 { left: 84px;  top: 2px;  animation-delay: .22s; font-size: 18px; }
  .twinkle.t4 { right: 70px; top: 44px; animation-delay: .3s;  font-size: 11px; }

  /* ---------- кнопки ---------- */
  .buttons {
    position: relative;
    height: 118px;
    transform: translateZ(40px);
  }

  .btn-yes {
    position: absolute;
    left: 50%;
    top: 4px;
    transform: translateX(-88%);
    width: 126px;
    height: 112px;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  .btn-yes .pulse {
    position: absolute;
    inset: 0;
    animation: yes-pulse 1.4s ease-in-out infinite;
  }
  @keyframes yes-pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.1); }
  }
  .btn-yes svg { width: 100%; height: 100%; overflow: visible; }
  .btn-yes .label {
    position: absolute;
    inset: 0 0 16px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 27px;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(170,20,80,.5);
    pointer-events: none;
  }
  .btn-yes:active .pulse { transform: scale(.92); }

  .btn-no {
    position: absolute;
    left: 50%;
    top: 34px;
    transform: translateX(14%);
    padding: 15px 34px;
    background: rgba(255,255,255,.10);
    border: 1.5px solid rgba(255,255,255,.4);
    border-radius: 18px;
    color: var(--cream);
    font-family: "Nunito", sans-serif;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    white-space: nowrap;
    touch-action: none;
  }
  .btn-no.runaway {
    position: fixed;
    left: 0; top: 0;
    transform: none;
    z-index: 60;
    transition: left .16s ease-out, top .16s ease-out;
  }

  .hint {
    margin-top: 4px;
    font-size: 12.5px;
    color: rgba(255,214,228,.65);
    transform: translateZ(24px);
  }

  /* ---------- финальная табличка ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(30, 8, 34, .62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .overlay.show { display: flex; }

  .final-card {
    width: min(90vw, 380px);
    border-radius: 32px;
    padding: 46px 28px 40px;
    text-align: center;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,140,180,.24), transparent 60%),
      linear-gradient(165deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.32);
    box-shadow: 0 34px 90px rgba(10,2,14,.7), inset 0 1px 0 rgba(255,255,255,.4);
    animation: pop-in .6s cubic-bezier(.18,1.45,.35,1);
  }
  @keyframes pop-in {
    0%   { transform: scale(.35) rotate(-4deg); opacity: 0; }
    100% { transform: scale(1) rotate(0);        opacity: 1; }
  }

  .ring-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto;
  }
  .ring-wrap svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: ring-sway 2.4s ease-in-out infinite;
    filter: drop-shadow(0 10px 26px rgba(246,198,107,.45));
  }
  @keyframes ring-sway {
    0%,100% { transform: rotate(-6deg) translateY(0); }
    50%     { transform: rotate(6deg)  translateY(-8px); }
  }
  .ring-spark {
    position: absolute;
    color: #fff;
    text-shadow: 0 0 12px #bfe3ff, 0 0 22px #8fcaff;
    animation: spark 1.5s ease-in-out infinite;
  }
  @keyframes spark {
    0%,100% { opacity: 0; transform: scale(.3); }
    50%     { opacity: 1; transform: scale(1.2); }
  }
  .ring-spark.s1 { top: 6px;   left: 50%;  font-size: 22px; }
  .ring-spark.s2 { top: 30px;  left: 16px; font-size: 13px; animation-delay: .4s; }
  .ring-spark.s3 { top: 22px;  right: 14px;font-size: 16px; animation-delay: .8s; }

  .final-text {
    margin-top: 20px;
    font-size: 17.5px;
    font-weight: 600;
    color: var(--cream);
    line-height: 1.55;
  }
  .final-text .accent {
    display: block;
    margin-top: 12px;
    font-family: "Caveat", cursive;
    font-size: clamp(38px, 11vw, 48px);
    font-weight: 700;
    color: #ffd0e0;
    text-shadow: 0 2px 24px rgba(255,110,160,.7);
    line-height: 1.05;
  }

  .btn-final {
    margin-top: 26px;
    padding: 16px 44px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(150deg, #ff8fb3, var(--rose-hot));
    color: #fff;
    font-family: "Nunito", sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(255,79,135,.45), inset 0 1px 0 rgba(255,255,255,.45);
    animation: yes-pulse 1.4s ease-in-out infinite;
  }
  .btn-final:active { transform: scale(.94); }

  .celebrated .btn-final { display: none; }
  .celebrated .accent {
    font-size: clamp(27px, 7.6vw, 34px) !important;
    line-height: 1.2 !important;
    word-break: break-word;
  }

  /* летящие сердечки-конфетти */
  .confetti {
    position: fixed;
    top: -50px;
    z-index: 90;
    pointer-events: none;
    will-change: transform;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="sky">
    <div class="layer" data-depth="14" id="layer1"></div>
    <div class="layer" data-depth="30" id="layer2"></div>
    <div class="layer" data-depth="52" id="layer3"></div>
  </div>

  <div class="scene">
    <div class="card3d" id="card">
      <div class="eyebrow">только для тебя</div>
      <div class="question">Хочешь сходить со мной на свидание? 💕</div>

      <div class="stage">
        <span class="twinkle t1">✦</span>
        <span class="twinkle t2">✦</span>
        <span class="twinkle t3">✧</span>
        <span class="twinkle t4">✦</span>

        <!-- мишка -->
        <svg class="bear" viewBox="0 0 240 262" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="fur" cx="42%" cy="30%" r="85%">
              <stop offset="0%"  stop-color="#f6d5ae"/>
              <stop offset="60%" stop-color="#e9b98d"/>
              <stop offset="100%" stop-color="#d9a172"/>
            </radialGradient>
            <radialGradient id="belly" cx="50%" cy="35%" r="80%">
              <stop offset="0%"  stop-color="#fff2df"/>
              <stop offset="100%" stop-color="#f7ddba"/>
            </radialGradient>
          </defs>

          <!-- тень -->
          <ellipse cx="120" cy="252" rx="72" ry="9" fill="#1c0a20" opacity=".28"/>

          <!-- уши -->
          <circle cx="70"  cy="52" r="25" fill="url(#fur)"/>
          <circle cx="170" cy="52" r="25" fill="url(#fur)"/>
          <circle cx="70"  cy="53" r="12" fill="#ffd3e0"/>
          <circle cx="170" cy="53" r="12" fill="#ffd3e0"/>

          <!-- голова -->
          <ellipse cx="120" cy="96" rx="60" ry="55" fill="url(#fur)"/>

          <!-- мордочка -->
          <ellipse cx="120" cy="117" rx="27" ry="19" fill="url(#belly)"/>

          <!-- счастливые глаза ^ ^ -->
          <path d="M88 88 q10 -13 20 0"  stroke="#3d2b23" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M132 88 q10 -13 20 0" stroke="#3d2b23" stroke-width="5" fill="none" stroke-linecap="round"/>

          <!-- румянец -->
          <ellipse cx="74"  cy="106" rx="11" ry="6.5" fill="#ff9cbb" opacity=".7"/>
          <ellipse cx="166" cy="106" rx="11" ry="6.5" fill="#ff9cbb" opacity=".7"/>

          <!-- нос и улыбка -->
          <ellipse cx="120" cy="110" rx="8.5" ry="6.5" fill="#7c4a2d"/>
          <path d="M120 117 q0 7 -8 9 M120 117 q0 7 8 9" stroke="#7c4a2d" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- тело -->
          <ellipse cx="120" cy="196" rx="54" ry="52" fill="url(#fur)"/>
          <ellipse cx="120" cy="206" rx="31" ry="30" fill="url(#belly)"/>

          <!-- ножки -->
          <ellipse cx="84"  cy="242" rx="21" ry="13" fill="url(#fur)"/>
          <ellipse cx="156" cy="242" rx="21" ry="13" fill="url(#fur)"/>
          <ellipse cx="84"  cy="244" rx="10" ry="6" fill="#ffd3e0" opacity=".85"/>
          <ellipse cx="156" cy="244" rx="10" ry="6" fill="#ffd3e0" opacity=".85"/>

          <!-- лапки (анимируются) -->
          <g class="arm left">
            <ellipse cx="70" cy="182" rx="16" ry="26" fill="url(#fur)" transform="rotate(24 70 182)"/>
            <circle cx="62" cy="202" r="12" fill="url(#fur)"/>
          </g>
          <g class="arm right">
            <ellipse cx="170" cy="182" rx="16" ry="26" fill="url(#fur)" transform="rotate(-24 170 182)"/>
            <circle cx="178" cy="202" r="12" fill="url(#fur)"/>
          </g>
        </svg>

        <!-- сердечко -->
        <svg class="fly-heart" viewBox="0 0 60 60">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  stop-color="#ff9cc0"/>
              <stop offset="100%" stop-color="#ff4f87"/>
            </linearGradient>
          </defs>
          <path d="M30 54 C 12 40, 3 28, 3 17 C 3 7, 11 2, 19 2 C 25 2, 28 6, 30 10 C 32 6, 35 2, 41 2 C 49 2, 57 7, 57 17 C 57 28, 48 40, 30 54 Z" fill="url(#hg)"/>
          <ellipse cx="19" cy="14" rx="6.5" ry="4" fill="#fff" opacity=".5" transform="rotate(-25 19 14)"/>
        </svg>
      </div>

      <div class="buttons">
        <button class="btn-yes" id="btnYes" aria-label="Да">
          <span class="pulse">
            <svg viewBox="0 0 126 112">
              <defs>
                <linearGradient id="yg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%"  stop-color="#ff8fb3"/>
                  <stop offset="100%" stop-color="#ff4f87"/>
                </linearGradient>
              </defs>
              <path d="M63 106 C 22 76, 2 53, 2 32 C 2 11, 19 1, 36 1 C 49 1, 59 9, 63 20 C 67 9, 77 1, 90 1 C 107 1, 124 11, 124 32 C 124 53, 104 76, 63 106 Z"
                    fill="url(#yg)" style="filter: drop-shadow(0 10px 22px rgba(255,79,135,.55))"/>
              <ellipse cx="36" cy="24" rx="14" ry="9" fill="#fff" opacity=".35" transform="rotate(-28 36 24)"/>
            </svg>
            <span class="label">Да</span>
          </span>
        </button>
        <button class="btn-no" id="btnNo">Нет</button>
      </div>

      <div class="hint">наклони телефон — сердечки оживут ✨</div>
    </div>
  </div>

  <!-- финальная табличка -->
  <div class="overlay" id="overlay">
    <div class="final-card" id="finalCard">
      <div class="ring-wrap">
        <span class="ring-spark s1">✦</span>
        <span class="ring-spark s2">✧</span>
        <span class="ring-spark s3">✦</span>
        <svg viewBox="0 0 150 150">
          <defs>
            <linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#ffe6a6"/>
              <stop offset="45%"  stop-color="#f6c66b"/>
              <stop offset="100%" stop-color="#d99a2b"/>
            </linearGradient>
            <linearGradient id="diam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#ffffff"/>
              <stop offset="55%" stop-color="#cfe9ff"/>
              <stop offset="100%" stop-color="#8fcaff"/>
            </linearGradient>
          </defs>
          <!-- ободок -->
          <circle cx="75" cy="92" r="42" fill="none" stroke="url(#goldg)" stroke-width="13"/>
          <circle cx="75" cy="92" r="42" fill="none" stroke="#fff" stroke-width="3" opacity=".35" stroke-dasharray="30 300" stroke-linecap="round"/>
          <!-- крепление -->
          <path d="M62 52 L75 36 L88 52 Z" fill="url(#goldg)"/>
          <!-- бриллиант -->
          <g>
            <polygon points="75,8 94,26 75,46 56,26" fill="url(#diam)"/>
            <polyline points="56,26 75,30 94,26" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
            <line x1="75" y1="30" x2="75" y2="46" stroke="#9fd0f5" stroke-width="2" opacity=".8"/>
          </g>
        </svg>
      </div>

      <div class="final-text" id="finalText">
        Ну что же, здравствуй, вот и я.
        <span class="accent">Выйдешь за меня?<br>Выйдешь за меня?</span>
      </div>

      <button class="btn-final" id="btnFinal">Да! 💍</button>
    </div>
  </div>

<script>
(function () {
  var btnNo    = document.getElementById('btnNo');
  var btnYes   = document.getElementById('btnYes');
  var btnFinal = document.getElementById('btnFinal');
  var overlay  = document.getElementById('overlay');
  var finalCard = document.getElementById('finalCard');
  var finalText = document.getElementById('finalText');
  var card     = document.getElementById('card');

  /* ================= параллакс-фон ================= */
  var layers = [
    { el: document.getElementById('layer1'), depth: 14, count: 10, min: 10, max: 16, op: .35 },
    { el: document.getElementById('layer2'), depth: 30, count: 8,  min: 14, max: 22, op: .55 },
    { el: document.getElementById('layer3'), depth: 52, count: 6,  min: 20, max: 32, op: .8 }
  ];
  var glyphs = ['💗','💖','🤍','💘','♡','💕'];

  layers.forEach(function (l) {
    for (var i = 0; i < l.count; i++) {
      var m = document.createElement('span');
      m.className = 'mote';
      m.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      m.style.left = (Math.random() * 100) + '%';
      m.style.top  = (Math.random() * 100) + '%';
      m.style.fontSize = (l.min + Math.random() * (l.max - l.min)) + 'px';
      m.style.opacity = l.op * (0.6 + Math.random() * 0.4);
      m.style.animationDuration = (3 + Math.random() * 4) + 's';
      m.style.animationDelay = (-Math.random() * 4) + 's';
      l.el.appendChild(m);
    }
  });

  /* вход: наклон телефона (гироскоп) или движение пальца/мыши */
  var tx = 0, ty = 0;       // цель (-1..1)
  var cx = 0, cy = 0;       // текущее (сглаженное)

  function tick() {
    cx += (tx - cx) * 0.07;
    cy += (ty - cy) * 0.07;
    layers.forEach(function (l) {
      l.el.style.transform = 'translate3d(' + (-cx * l.depth) + 'px,' + (-cy * l.depth) + 'px,0)';
    });
    card.style.setProperty('--ry', (cx * 7) + 'deg');
    card.style.setProperty('--rx', (-cy * 7) + 'deg');
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('deviceorientation', function (e) {
    if (e.gamma === null) return;
    tx = Math.max(-1, Math.min(1, e.gamma / 28));
    ty = Math.max(-1, Math.min(1, (e.beta - 45) / 32));
  });

  /* iOS просит разрешение на гироскоп — спрашиваем при первом касании */
  var asked = false;
  document.addEventListener('touchend', function () {
    if (asked) return;
    asked = true;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().catch(function () {});
    }
  }, { once: false });

  document.addEventListener('pointermove', function (e) {
    tx = (e.clientX / window.innerWidth  - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ================= убегающая кнопка "Нет" ================= */
  var escaped = 0;
  var teases = ['Нет', 'Не-а 😜', 'Не догонишь!', 'Ну попробуй 😏', 'Может, «Да»? 🥺', 'Тут только «Да» 💕'];

  function moveNo() {
    if (!escaped) {
      var r = btnNo.getBoundingClientRect();
      btnNo.classList.add('runaway');
      /* переносим кнопку в body, иначе position:fixed считается
         от 3D-карточки и кнопка улетает за её края и исчезает */
      document.body.appendChild(btnNo);
      btnNo.style.left = r.left + 'px';
      btnNo.style.top  = r.top + 'px';
    }
    escaped++;
    btnNo.textContent = teases[Math.min(escaped, teases.length - 1)];

    var bw = btnNo.offsetWidth, bh = btnNo.offsetHeight, pad = 14;
    var maxX = window.innerWidth  - bw - pad;
    var maxY = window.innerHeight - bh - pad;
    var cur = btnNo.getBoundingClientRect();
    var x, y, tries = 0;
    do {
      x = pad + Math.random() * (maxX - pad);
      y = pad + Math.random() * (maxY - pad);
      tries++;
    } while (Math.hypot(x - cur.left, y - cur.top) < 150 && tries < 30);

    btnNo.style.left = x + 'px';
    btnNo.style.top  = y + 'px';
    if (navigator.vibrate) navigator.vibrate(15);
  }

  /* убегает от пальца ДО клика и от мыши при приближении */
  btnNo.addEventListener('touchstart', function (e) { e.preventDefault(); moveNo(); }, { passive: false });
  btnNo.addEventListener('pointerdown', function (e) { e.preventDefault(); moveNo(); });
  btnNo.addEventListener('click', function (e) { e.preventDefault(); moveNo(); });
  document.addEventListener('mousemove', function (e) {
    var r = btnNo.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < 85) moveNo();
  });

  /* ================= "Да" → табличка с кольцом ================= */
  btnYes.addEventListener('click', function () {
    if (navigator.vibrate) navigator.vibrate([30, 40, 90]);
    overlay.classList.add('show');
    btnNo.style.display = 'none';
    burst(60);
  });

  /* финальное "Да!" */
  btnFinal.addEventListener('click', function () {
    if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 160]);
    finalCard.classList.add('celebrated');
    finalText.innerHTML = 'Она сказала <b>ДА!</b> 🎉<span class="accent">Пацаны, я сорвал джекпот в этом миреее! ДАААААААААА! 🎰❤️</span>';
    burst(120);
    setInterval(function () { burst(8); }, 1800);
  });

  /* ================= салют из сердечек ================= */
  var emojis = ['💗','💖','💘','💝','❤️','💕','✨'];
  function burst(n) {
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var h = document.createElement('div');
          h.className = 'confetti';
          h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          var size = 16 + Math.random() * 26;
          h.style.fontSize = size + 'px';
          h.style.left = (Math.random() * 100) + 'vw';
          document.body.appendChild(h);

          var dur = 2600 + Math.random() * 2600;
          var sway = (Math.random() - 0.5) * 160;
          h.animate([
            { transform: 'translate(0,0) rotate(0deg)',    opacity: 1 },
            { transform: 'translate(' + sway + 'px,' + (window.innerHeight + 90) + 'px) rotate(' + (180 + Math.random() * 360) + 'deg)', opacity: .85 }
          ], { duration: dur, easing: 'cubic-bezier(.3,.1,.6,1)' });
          setTimeout(function () { h.remove(); }, dur);
        }, i * 45);
      })(i);
    }
  }
})();
</script>
</body>
</html>
